function seed(){let n=0;for(const [name,str] of Object.entries(DATA)){if(S.classes.some(c=>c.name===name))continue;
  S.classes.push({id:uid(),name,students:str.split('|').map(x=>({id:uid(),name:x})),cfg:{n:25,pt:2,key:[],es:[10,10,10,10,10],rub:[]}});n++}
  if(!S.cur&&S.classes[0])S.cur=S.classes[0].id;S.seeded=1;save();return n}
if(!S.seeded)seed();
const cls=()=>S.classes.find(c=>c.id===S.cur);
const getA=(c,s)=>{const a=(S.ans[c.id]=S.ans[c.id]||{});return a[s]=a[s]||{pg:[],es:[],nt:[],ph:[]}};
function maxTotal(c){const f=c.cfg;return f.n*f.pt+f.es.reduce((a,b)=>a+(+b||0),0)}
function calc(c,sid){
  const f=c.cfg,a=((S.ans[c.id]||{})[sid])||{pg:[],es:[]};
  let ok=0;for(let i=0;i<f.n;i++)if(a.pg[i]&&a.pg[i]===f.key[i])ok++;
  const pg=ok*f.pt;let es=0;f.es.forEach((m,i)=>{es+=Math.min(+a.es[i]||0,+m||0)});
  const M=maxTotal(c);
  return{ok,pg,es,total:M?Math.round((pg+es)/M*1000)/10:0,done:a.pg.some(x=>x)||a.es.some(x=>x!==undefined&&x!=='')}
}

/* ===== Kelas ===== */
function addClass(){const n=$('#newCls').value.trim();if(!n)return;
  const c={id:uid(),name:n,students:[],cfg:{n:25,pt:2,key:[],es:[10,10,10,10,10],rub:[]}};
  S.classes.push(c);S.cur=c.id;stu=null;save();render()}
function pickClass(id){S.cur=id;stu=null;save();render()}
function delClass(id){if(!confirm('Hapus kelas beserta semua datanya?'))return;
  S.classes=S.classes.filter(c=>c.id!==id);delete S.ans[id];S.cur=S.classes[0]?.id||null;stu=null;save();render()}
function addNames(list){const c=cls();if(!c)return alert('Buat kelas dulu.');
  const ex=new Set(c.students.map(s=>s.name.toLowerCase()));let n=0;
  list.map(x=>x.trim()).filter(Boolean).forEach(x=>{if(!ex.has(x.toLowerCase())){c.students.push({id:uid(),name:x});ex.add(x.toLowerCase());n++}});
  save();render();alert(n+' siswa ditambahkan.')}
function importPaste(){addNames($('#paste').value.split(/\r?\n/).map(l=>l.replace(/^\s*\d+[.)]\s*/,'')))}
function importFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{let rows=String(r.result).replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim());
    const sep=(rows[0]||'').includes(';')?';':',';
    let col=0;const h=(rows[0]||'').split(sep).map(x=>x.trim().toLowerCase().replace(/"/g,''));
    const hi=h.findIndex(x=>x.includes('nama'));
    if(hi>=0){col=hi;rows.shift()}
    addNames(rows.map(l=>(l.split(sep)[col]||'').replace(/"/g,'')))};
  r.readAsText(f);inp.value=''}
function delStu(id){const c=cls();c.students=c.students.filter(s=>s.id!==id);delete (S.ans[c.id]||{})[id];if(stu===id)stu=null;save();render()}

/* ===== Kunci & Bobot ===== */
function setCfg(k,v){const f=cls().cfg;f[k]=Math.max(0,+v||0);save();render()}
function setEsCount(v){const f=cls().cfg;v=Math.max(0,Math.min(20,+v||0));while(f.es.length<v)f.es.push(10);f.es.length=v;save();render()}
function setEsMax(i,v){cls().cfg.es[i]=Math.max(0,+v||0);save();render()}
function setKey(i,l){const k=cls().cfg.key;k[i]=k[i]===l?'':l;save();render()}
function setRub(i,v){const f=cls().cfg;f.rub=f.rub||[];f.rub[i]=v;save()}
function setRubImg(i,inp){const f=inp.files[0];if(!f)return;PV['r'+cls().id+i]=URL.createObjectURL(f);render()}
function copyCfg(){if(!confirm('Salin kunci & bobot kelas ini ke SEMUA kelas? Pengaturan kelas lain akan ditimpa.'))return;const j=JSON.stringify(cls().cfg);S.classes.forEach(k=>k.cfg=JSON.parse(j));save();alert('Tersalin ke '+S.classes.length+' kelas.')}

/* ===== Koreksi ===== */
function pickStu(id){stu=id;render()}
function setPg(i,l){const a=getA(cls(),stu);a.pg[i]=a.pg[i]===l?'':l;save();render()}
function quickPg(v){const c=cls(),a=getA(c,stu);
  if(/\d/.test(v)){const re=/(\d+)\s*[.:=\-)]?\s*([A-Da-d])/g;let m;
    while((m=re.exec(v))){const i=+m[1]-1;if(i>=0&&i<c.cfg.n)a.pg[i]=m[2].toUpperCase()}}
  else{const ch=v.toUpperCase().replace(/[^ABCD\-]/g,'').split('');
    for(let i=0;i<c.cfg.n;i++)a.pg[i]=(ch[i]&&ch[i]!=='-')?ch[i]:''}
  save();render()}
function setEs(i,v){const a=getA(cls(),stu),m=+cls().cfg.es[i]||0;
  a.es[i]=v===''?'':Math.min(Math.max(0,+v||0),m);save();render()}
function setNt(i,v){getA(cls(),stu).nt[i]=v;save()}
function setPh(i,inp){const f=inp.files[0];if(!f)return;
  getA(cls(),stu).ph[i]=f.name;PV[stu+'_'+i]=URL.createObjectURL(f);save();render()}
function nav(d){const c=cls(),i=c.students.findIndex(s=>s.id===stu)+d;if(c.students[i]){stu=c.students[i].id;render()}}

/* ===== Ekspor ===== */
function rows(c){return c.students.map((s,i)=>{const r=calc(c,s.id);return[i+1,s.name,r.pg,r.es,r.total]})}
function dl(name,type,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
function exportCsv(){const c=cls();
  const l=[['No','Nama Siswa','Skor PG','Skor Uraian','Nilai Akhir'],...rows(c)].map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';'));
  dl('Rekap_'+c.name+'.csv','text/csv;charset=utf-8','\uFEFFsep=;\n'+l.join('\n'))}
function exportXls(){const c=cls();
  const t='<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body><h3>Rekapitulasi Nilai - '+esc(c.name)+'</h3><table border="1" style="border-collapse:collapse"><tr style="background:#e0e7ff;font-weight:bold"><td>No</td><td>Nama Siswa</td><td>Skor PG</td><td>Skor Uraian</td><td>Nilai Akhir</td></tr>'
   +rows(c).map(r=>'<tr>'+r.map((x,i)=>'<td'+(i===1?'':' align="center"')+'>'+esc(x)+'</td>').join('')+'</tr>').join('')
   +'</table><p>Skor maksimal: '+maxTotal(c)+'</p></body></html>';
  dl('Rekap_'+c.name+'.xls','application/vnd.ms-excel',t)}

/* ===== Render ===== */
const TABS=[['kelas','👥 Kelas & Siswa'],['kunci','🔑 Kunci & Bobot'],['nilai','✍️ Koreksi'],['rekap','📊 Rekap & Ekspor']];
const card='bg-white rounded-xl shadow p-4 mb-4',btn='px-3 py-2 rounded-lg text-sm font-medium ',pri=btn+'bg-indigo-600 text-white hover:bg-indigo-700',inp='border rounded-lg px-3 py-2 text-sm';
function opt(handler,i,val,pickedFn){return['A','B','C','D'].map(l=>`<button onclick="${handler}(${i},'${l}')" class="w-8 h-8 rounded-md text-xs font-bold border ${pickedFn(l,val)}">${l}</button>`).join('')}
function render(){
  $('#clsSel').innerHTML=S.classes.length?S.classes.map(c=>`<option value="${c.id}" ${c.id===S.cur?'selected':''}>${esc(c.name)}</option>`).join(''):'<option>(belum ada kelas)</option>';
  $('#nav').innerHTML=TABS.map(([k,t])=>`<button onclick="tab='${k}';render()" class="px-4 py-2 text-sm whitespace-nowrap rounded-t-lg ${tab===k?'bg-slate-100 text-indigo-700 font-semibold':'text-indigo-100 hover:bg-indigo-500'}">${t}</button>`).join('');
  const c=cls();
  if(!c&&tab!=='kelas')tab='kelas';
  $('#main').innerHTML={kelas:vKelas,kunci:vKunci,nilai:vNilai,rekap:vRekap}[tab](c);
}

  <p class="mt-4 text-sm bg-indigo-50 rounded-lg p-3">Skor maksimal total: <b>${maxTotal(c)}</b> &nbsp;|&nbsp; Kunci terisi: <b>${f.key.filter(Boolean).length}/${f.n}</b></p><button class="${btn}bg-slate-700 text-white mt-3" onclick="copyCfg()">📋 Salin kunci & bobot ini ke semua kelas</button></div>`}
function vNilai(c){
  const list=`<div class="${card} md:w-64 shrink-0 max-h-[75vh] overflow-auto"><h2 class="font-bold mb-2 text-sm">Siswa</h2>${c.students.map((s,i)=>{const r=calc(c,s.id);return`<button onclick="pickStu('${s.id}')" class="w-full text-left text-sm px-2 py-1.5 rounded-lg flex justify-between ${s.id===stu?'bg-indigo-600 text-white':'hover:bg-slate-100'}"><span class="truncate">${i+1}. ${esc(s.name)}</span><span>${r.done?'✔ '+r.total:''}</span></button>`}).join('')||'<p class="text-sm text-slate-500">Impor siswa dulu.</p>'}</div>`;
  if(!stu||!c.students.find(s=>s.id===stu))return`<div class="flex flex-col md:flex-row gap-4">${list}<div class="${card} flex-1 text-slate-500">Pilih siswa di sebelah kiri untuk mulai mengoreksi.</div></div>`;
  const s=c.students.find(x=>x.id===stu),a=getA(c,stu),f=c.cfg,r=calc(c,stu);
  const key=f.key;
  return`<div class="flex flex-col md:flex-row gap-4">${list}<div class="flex-1">
  <div class="${card} flex flex-wrap items-center gap-3"><h2 class="font-bold text-lg flex-1">${esc(s.name)}</h2>
   <span class="bg-emerald-100 px-3 py-1 rounded-full text-sm">PG: ${r.ok}/${f.n} = <b>${r.pg}</b></span>
   <span class="bg-amber-100 px-3 py-1 rounded-full text-sm">Uraian: <b>${r.es}</b></span>
   <span class="bg-indigo-600 text-white px-3 py-1 rounded-full text-sm">Nilai: <b>${r.total}</b></span>
   <button class="${btn}bg-slate-200" onclick="nav(-1)">◀</button><button class="${btn}bg-slate-200" onclick="nav(1)">▶</button></div>
  <div class="${card}"><h3 class="font-semibold mb-2">Pilihan Ganda</h3>
   <label class="text-sm block mb-3">Input cepat — tulis bebas: <b>1 A, 2 C, 3 D, 4 B, ...</b> (boleh sebagian nomor saja) atau huruf berurutan <b>ACDB...</b> (<b>-</b> = kosong). Klik di luar kotak / tekan Tab untuk memproses.
   <textarea rows="2" class="${inp} w-full mt-1 font-mono uppercase" onchange="quickPg(this.value)" placeholder="1 A, 2 C, 3 D, 4 B, 5 A ..."></textarea></label>
   <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-1">${Array.from({length:f.n},(_,i)=>`<div class="flex items-center gap-2"><span class="w-7 text-right text-sm text-slate-500">${i+1}.</span>${opt('setPg',i,a.pg[i],(l,v)=>v!==l?'bg-white hover:bg-slate-100':(!key[i]?'bg-slate-500 text-white':v===key[i]?'bg-emerald-500 text-white border-emerald-500':'bg-red-500 text-white border-red-500'))}${a.pg[i]&&key[i]&&a.pg[i]!==key[i]?`<span class="text-xs text-slate-400">kunci ${key[i]}</span>`:''}</div>`).join('')}</div></div>
  <div class="${card}"><h3 class="font-semibold mb-2">Uraian & Bukti Foto</h3>${f.es.map((m,i)=>`<div class="border rounded-lg p-3 mb-2 grid md:grid-cols-[auto_1fr_1fr] gap-3 items-start">
   ${(f.rub||[])[i]||PV['r'+c.id+i]?`<div class="md:col-span-3 text-xs bg-amber-50 rounded p-2">${(f.rub||[])[i]?'Kunci: '+esc(f.rub[i]):''}${PV['r'+c.id+i]?`<img src="${PV['r'+c.id+i]}" class="max-h-20 mt-1 rounded border">`:''}</div>`:''}<label class="text-sm">No. ${f.n+i+1} (maks ${m})<input type="number" min="0" max="${m}" step="0.5" value="${a.es[i]??''}" onchange="setEs(${i},this.value)" class="${inp} w-24 block mt-1"></label>
   <label class="text-sm">Catatan guru<textarea rows="2" onchange="setNt(${i},this.value)" class="${inp} w-full mt-1">${esc(a.nt[i]||'')}</textarea></label>
   <div class="text-sm">Foto jawaban<input type="file" accept="image/*" onchange="setPh(${i},this)" class="block mt-1 text-xs">${a.ph[i]?`<p class="text-xs text-slate-500 mt-1">📎 ${esc(a.ph[i])}</p>`:''}${PV[stu+'_'+i]?`<img src="${PV[stu+'_'+i]}" class="mt-1 max-h-28 rounded border">`:''}</div></div>`).join('')||'<p class="text-sm text-slate-500">Tidak ada soal uraian.</p>'}
   <p class="text-xs text-slate-400">Foto hanya ditampilkan selama sesi; yang tersimpan permanen hanya nama file & catatan.</p></div></div></div>`}
function vRekap(c){
  const R=c.students.map(s=>calc(c,s.id)),v=R.filter(r=>r.done).map(r=>r.total);
  const avg=v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'-';
  return`<div class="${card}"><div class="noprint flex flex-wrap gap-2 mb-3"><button class="${pri}" onclick="exportXls()">⬇ Excel (.xls)</button><button class="${btn}bg-emerald-600 text-white" onclick="exportCsv()">⬇ CSV</button><button class="${btn}bg-slate-700 text-white" onclick="window.print()">🖨 Cetak</button></div>
  <h2 class="font-bold">Rekapitulasi Nilai — ${esc(c.name)}</h2>
  <p class="text-sm text-slate-500 mb-3">Skor maksimal: ${maxTotal(c)} · Rata-rata: <b>${avg}</b> · Tertinggi: <b>${v.length?Math.max(...v):'-'}</b> · Terendah: <b>${v.length?Math.min(...v):'-'}</b> · Sudah dikoreksi: ${v.length}/${c.students.length}</p>
  <div class="overflow-x-auto"><table class="w-full text-sm border-collapse"><thead><tr class="bg-indigo-50 text-left"><th class="border p-2 w-10">No</th><th class="border p-2">Nama Siswa</th><th class="border p-2 text-center">Skor PG</th><th class="border p-2 text-center">Skor Uraian</th><th class="border p-2 text-center">Nilai Akhir</th></tr></thead><tbody>
  ${c.students.map((s,i)=>`<tr><td class="border p-2">${i+1}</td><td class="border p-2">${esc(s.name)}</td><td class="border p-2 text-center">${R[i].pg}</td><td class="border p-2 text-center">${R[i].es}</td><td class="border p-2 text-center font-bold">${R[i].done?R[i].total:'-'}</td></tr>`).join('')}</tbody></table></div></div>`}
render();
</script>
</body>
</html>
